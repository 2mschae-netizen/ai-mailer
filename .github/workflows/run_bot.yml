name: Run IT Trend Mailer

# 언제 실행할지 설정
on:
  schedule:
    - cron: '0 0 * * *' # 매일 세계 표준시(UTC) 0시 = 한국 시간(KST) 오전 9시
  workflow_dispatch: # 우리가 원할 때 수동으로도 실행할 수 있게 하는 버튼 생성

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 코드가져오기
      uses: actions/checkout@v4

    - name: 파이썬 설치하기
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: 필요한 패키지 설치하기
      run: |
        pip install -r requirements.txt

    - name: 파이썬 코드 실행하고 메일 보내기
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python main.py
